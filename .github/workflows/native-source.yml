name: Native source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native domain, recovery, UI and synthetic transport
        run: python scripts/ci_native.py
